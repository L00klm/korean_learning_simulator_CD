name: Korean Learning Simulator CD

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: korean-learning   # ✅ 심플 + 안전

jobs:
  # ================================
  # 1. Build & Push
  # ================================
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================
  # 2. Deploy
  # ================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "🚀 배포 시작"

            # ✅ 무조건 lowercase 보장
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
            FULL_IMAGE="ghcr.io/${OWNER}/korean-learning:${IMAGE_TAG}"

            DEPLOY_DIR="/home/${{ secrets.EC2_USERNAME }}/korean-learning"

            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            # ========================
            # docker-compose.yml 생성
            # ========================
            cat > docker-compose.yml << 'EOF'
            services:
              app:
                image: ${KOREAN_IMAGE}
                container_name: korean-learning
                restart: unless-stopped
                ports:
                  - "8000:8000"
                env_file:
                  - .env
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 10s
            EOF

            # ========================
            # .env 생성
            # ========================
            cat > .env << ENV
            ENVIRONMENT=production
            DEBUG=false

            UPSTAGE_API_KEY=${{ secrets.UPSTAGE_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            SUPABASE_CONNECTION_STRING=${{ secrets.SUPABASE_CONNECTION_STRING }}

            DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}

            ENABLE_LANGFUSE=true
            LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
            ENV

            # ========================
            # Docker compose 설정
            # ========================
            if docker compose version &> /dev/null; then
              DOCKER_COMPOSE="docker compose"
            else
              DOCKER_COMPOSE="docker-compose"
            fi

            # ========================
            # GHCR 로그인
            # ========================
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ========================
            # 이미지 Pull
            # ========================
            echo "📦 Pull: $FULL_IMAGE"
            docker pull $FULL_IMAGE

            export KOREAN_IMAGE=$FULL_IMAGE

            # ========================
            # 컨테이너 재시작
            # ========================
            $DOCKER_COMPOSE up -d --force-recreate

            # ========================
            # 헬스체크
            # ========================
            echo "⏳ 헬스체크..."

            for i in {1..12}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health/ || echo 000)

              if [ "$STATUS" = "200" ]; then
                echo "✅ 성공!"
                exit 0
              fi

              echo "시도 $i 실패 ($STATUS)"
              sleep 5
            done

            echo "❌ 헬스체크 실패"
            docker logs korean-learning --tail 100
            exit 1
