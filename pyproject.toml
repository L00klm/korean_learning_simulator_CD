[project]
name = "korean-learning-simulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "gradio>=5.24.0",
    "kiwipiepy>=0.23.0",
    "langgraph>=1.1.2",
    "langchain-upstage>=0.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24.0",            # 비동기 테스트 지원
    "pytest-cov>=4.0.0",                 # 커버리지 리포트
    "black>=24.0.0",                     # 코드 포매터
    "ruff>=0.8.0",                       # 린터 (flake8 대체)
    "mypy>=1.0.0",                       # 타입 체커
    "pre-commit>=4.0.0",                 # Git 훅 관리
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
